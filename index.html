  <style>
/* The Kobold Guild colour palette. Edit these values to recolour the page. */
:root {
  --ink: #073f37;
  --green: #005244;
  --mint: #41bea6;
  --cream: #efefdc;
  --magenta: #aa1b87;
  --paper: #fffdf4;
  --line: rgba(0, 82, 68, 0.28);
  --shadow: 0 12px 30px rgba(0, 82, 68, 0.10);
  --radius: 16px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.page {
  width: min(880px, calc(100% - 28px));
  margin: 0 auto;
  padding: 42px 0 56px;
}
.hero { text-align: center; margin-bottom: 28px; }
.badge {
  width: 82px;
  height: 82px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: var(--green);
  color: var(--cream);
  display: grid;
  place-items: center;
  font-weight: 900;
  letter-spacing: 0.08em;
  border: 4px solid var(--mint);
  box-shadow: var(--shadow);
}
h1 {
  margin: 0;
  font-size: clamp(2.2rem, 6vw, 4.4rem);
  line-height: 0.94;
  color: var(--green);
}
.subtitle {
  max-width: 640px;
  margin: 14px auto 0;
  font-size: 1rem;
  line-height: 1.6;
  opacity: 0.82;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 24px 0 22px;
}
button {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  transition: transform 120ms ease, opacity 120ms ease, box-shadow 120ms ease;
}
button:hover { transform: translateY(-1px); }
button:active { transform: translateY(0); }
.primary {
  background: var(--magenta);
  color: white;
  box-shadow: 0 8px 20px rgba(170, 27, 135, 0.22);
}
.secondary { background: var(--green); color: var(--cream); }
.ghost { background: transparent; color: var(--green); border: 2px solid var(--green); }
.generator { display: grid; gap: 10px; }
.row {
  display: grid;
  grid-template-columns: minmax(145px, 205px) minmax(0, 1fr) 46px 46px;
  align-items: stretch;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--paper);
  box-shadow: 0 4px 14px rgba(0, 82, 68, 0.045);
}
.label {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 15px 16px;
  background: var(--mint);
  color: var(--green);
  font: inherit;
  font-weight: 900;
  line-height: 1.15;
}
.value {
  display: flex;
  align-items: center;
  min-height: 56px;
  min-width: 0;
  padding: 10px 16px;
  line-height: 1.35;
  color: #183f38;
}
.value select {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: white;
  color: var(--ink);
  font: inherit;
}
.icon-btn {
  width: 100%;
  height: 100%;
  min-height: 56px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 0;
  background: rgba(65, 190, 166, 0.10);
  color: var(--green);
  font-size: 1rem;
  border-left: 1px solid rgba(0, 82, 68, 0.12);
}
.icon-btn:hover { background: rgba(65, 190, 166, 0.22); }
.icon-btn.locked { background: var(--green); color: var(--cream); }
.adult-option { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.adult-option input { accent-color: var(--magenta); width: 18px; height: 18px; }
.note { text-align: center; font-size: 0.86rem; opacity: 0.7; margin: 20px 0 0; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--green);
  color: var(--cream);
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease;
  z-index: 50;
}
.toast.show { opacity: 1; }
.hidden { display: none !important; }
@media (max-width: 680px) {
  .page { width: min(100% - 14px, 880px); padding-top: 26px; }
  .row { grid-template-columns: minmax(96px, 118px) minmax(0, 1fr) 38px 38px; }
  .label { padding: 10px; font-size: 0.82rem; }
  .value { min-height: 54px; padding: 10px; font-size: 0.88rem; overflow-wrap: anywhere; }
  .icon-btn { min-height: 54px; font-size: 0.9rem; }
}
@media print {
  .controls, .icon-btn, .note, .adult-option { display: none !important; }
  .page { padding: 0; }
  .row { break-inside: avoid; grid-template-columns: 180px minmax(0, 1fr); }
}

// SECTION 6: OMEGAVERSE WEIGHTS. Must add to 100 for percentages.
// Current split: 5% dominant Omega, 5% recessive Omega,
//                60% Beta, 15% dominant Alpha, 15% recessive Alpha.
const OMEGAVERSE = [
  { name: "Dominant Omega", weight: 5 },
  { name: "Recessive Omega", weight: 5 },
  { name: "Beta", weight: 60 },
  { name: "Dominant Alpha", weight: 15 },

];

/* ════════════════════════════════════════════════════════════════════════
      GENERATOR ENGINE — No edits needed below this line
   ════════════════════════════════════════════════════════════════════════ */

// Combine name groups automatically, so there's never a second list to update.

  'First Name': Object.values(FIRST_NAMES).flat(),
  'Last Name': Object.values(LAST_NAMES).flat(),

  Class: Object.keys(SUBCLASSES),

};

  'Dexterity',
  'Constitution',
  'Intelligence',
  'Wisdom',
  'Charisma'
];

// Display order of the rows, including special dice-roll fields.
const FIELDS = [
  'First Name',
  'Last Name',
  'Species',
  'Class',
  'Subclass',
  'Background',
  ...STATS,
  'Favourite Weapon',
  'Armour',
  'Personality',
  'Height',
  'Body Shape',
  'Gender',
  'Sexuality',
  'Omegaverse',
  'Schlong Size',
  'Breast Cup Size (EU)'
];

const ADULT_FIELDS = [
  'Schlong Size',
  'Breast Cup Size (EU)'
];

const state = {};
const locks = new Set();
let showAdult = false;
let toastTimeout;

const byId = id => document.getElementById(id);
const randomInt = max => Math.floor(Math.random() * max); // 0 to max - 1
const randomFrom = items => items[randomInt(items.length)];
const die = sides => 1 + randomInt(sides);

function rollAbilityScore() {
  let total = 0;
  for (let i = 0; i < DICE_SETTINGS.abilityDice; i++) {
    total += die(DICE_SETTINGS.abilitySides);
  }
  return total; // Only the final number. No modifiers or individual dice.
}

function rollOmegaverse() {
  const totalWeight = OMEGAVERSE.reduce((sum, option) => sum + option.weight, 0);
  let number = randomInt(totalWeight);
  for (const option of OMEGAVERSE) {
    if (number < option.weight) return option.name;
    number -= option.weight;
  }
  return OMEGAVERSE.at(-1).name;
}

function notify(message) {
  const el = byId('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 1800);
}

function rollField(field) {
  if (locks.has(field)) return;

  if (field === 'Class') {
    if (locks.has('Subclass')) {
      // Do not allow a locked subclass to end up assigned to the wrong class.
      return;
    }
    state.Class = randomFrom(TABLES.Class);
    state.Subclass = randomFrom(SUBCLASSES[state.Class]);
    displayField('Class');
    displayField('Subclass');
    return;
  }

  if (field === 'Subclass') {
    state.Subclass = randomFrom(SUBCLASSES[state.Class]);
  } else if (field === 'Height') {
    const { minHeightFeet, maxHeightFeet, inchesPerFoot } = DICE_SETTINGS;
    const feet = minHeightFeet + randomInt(maxHeightFeet - minHeightFeet + 1);
    state.Height = `${feet} ft ${randomInt(inchesPerFoot)} in`;
  } else if (field === 'Schlong Size') {
    const { adultMinInches, adultMaxInches } = DICE_SETTINGS;
    state[field] = `${adultMinInches + randomInt(adultMaxInches - adultMinInches + 1)} inches`;
  } else if (field === 'Omegaverse') {
    state[field] = rollOmegaverse();
  } else if (STATS.includes(field)) {
    state[field] = rollAbilityScore();
  } else if (TABLES[field]) {
    state[field] = randomFrom(TABLES[field]);
  }

  displayField(field);
}

function displayField(field) {
  const holder = document.querySelector(`[data-value="${field}"]`);
  if (!holder) return;
  holder.replaceChildren();

  const choices = field === 'Subclass'
    ? SUBCLASSES[state.Class]
    : TABLES[field];

  if (choices) {
    const select = document.createElement('select');
    select.setAttribute('aria-label', `Choose ${field}`);
    for (const option of choices) {
      const element = document.createElement('option');
      element.value = option;
      element.textContent = option;
      select.appendChild(element);
    }
    select.value = state[field];
    select.addEventListener('change', () => {
      if (field === 'Class') {
        if (locks.has('Subclass')) {
          select.value = state.Class;
          notify('Unlock the subclass before changing class.');
          return;
        }
        state.Class = select.value;
        state.Subclass = randomFrom(SUBCLASSES[state.Class]);
        displayField('Subclass');
      } else {
        state[field] = select.value;
      }
    });
    holder.appendChild(select);
  } else {
    const value = document.createElement('span');
    value.textContent = state[field] ?? '—';
    holder.appendChild(value);
  }

  const lockButton = document.querySelector(`[data-lock="${field}"]`);
  if (lockButton) {
    const locked = locks.has(field);
    lockButton.classList.toggle('locked', locked);
    lockButton.textContent = locked ? '🔒' : '🔓';
    lockButton.title = `${locked ? 'Unlock' : 'Lock'} ${field}`;
    lockButton.setAttribute('aria-label', lockButton.title);
  }
}

function rollEverything() {
  for (const field of FIELDS) {
    if (field === 'Subclass') {
      // Class rolling already rolls its subclass. Roll separately only if
      // the class is locked and the subclass is free to change.
      if (locks.has('Class')) rollField('Subclass');
      continue;
    }
    if (ADULT_FIELDS.includes(field) && !showAdult) continue;
    rollField(field);
  }
  notify('The dice have spoken!');
}

function createRow(field, container) {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.row = field;

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = field;

  const value = document.createElement('div');
  value.className = 'value';
  value.dataset.value = field;

  const reroll = document.createElement('button');
  reroll.type = 'button';
  reroll.className = 'icon-btn';
  reroll.textContent = '↻';
  reroll.title = `Reroll ${field}`;
  reroll.setAttribute('aria-label', reroll.title);
  reroll.addEventListener('click', () => rollField(field));

  const lock = document.createElement('button');
  lock.type = 'button';
  lock.className = 'icon-btn';
  lock.dataset.lock = field;
  lock.title = `Lock ${field}`;
  lock.setAttribute('aria-label', lock.title);
  lock.addEventListener('click', () => {
    if (locks.has(field)) locks.delete(field);
    else locks.add(field);
    displayField(field);
  });

  row.append(label, value, reroll, lock);
  container.appendChild(row);
}

function fieldsForExport() {
  return FIELDS.filter(field => showAdult || !ADULT_FIELDS.includes(field));
}

function characterText() {
  return fieldsForExport()
    .map(field => `${field}: ${state[field] ?? '—'}`)
    .join('\n');
}

async function copyCharacter() {
  const text = characterText();
  try {
    await navigator.clipboard.writeText(text);
    notify('Character copied!');
  } catch (error) {
    // Fallback for local file:/// pages and browsers without Clipboard API.
    const box = document.createElement('textarea');
    box.value = text;
    document.body.appendChild(box);
    box.select();
    const worked = document.execCommand('copy');
    box.remove();
    notify(worked ? 'Character copied!' : 'Copy is unavailable in this browser.');
  }
}

function saveJSON() {
  const character = Object.fromEntries(
    fieldsForExport().map(field => [field, state[field]])
  );
  const blob = new Blob([JSON.stringify(character, null, 2)], {
    type: 'application/json'
  });
  const anchor = document.createElement('a');
  anchor.href = URL.createObjectURL(blob);
  anchor.download = 'roll-for-regret-character.json';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(anchor.href), 1000);
}

function start() {
  const container = byId('generator');
  FIELDS.forEach(field => createRow(field, container));

  byId('rollAll').addEventListener('click', rollEverything);
  byId('copy').addEventListener('click', copyCharacter);
  byId('download').addEventListener('click', saveJSON);
  byId('print').addEventListener('click', () => window.print());
  byId('adultToggle').addEventListener('change', event => {
    showAdult = event.target.checked;
    for (const field of ADULT_FIELDS) {
      document.querySelector(`[data-row="${field}"]`)
        .classList.toggle('hidden', !showAdult);
      if (showAdult && state[field] === undefined) {
        rollField(field);
      }
    }
  });
  for (const field of ADULT_FIELDS) {
    document.querySelector(`[data-row="${field}"]`).classList.add('hidden');
  }
  rollEverything();
}

document.addEventListener('DOMContentLoaded', start);
  </script>
</body>
</html>
